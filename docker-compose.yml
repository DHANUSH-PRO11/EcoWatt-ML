version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecowatt-backend
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=EcoWatt ML
      - APP_ENV=production
      - DATABASE_URL=sqlite:///./ecowatt.db
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    volumes:
      - backend-data:/app/data
      - backend-models:/app/ml/saved_models
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ecowatt-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-models:
